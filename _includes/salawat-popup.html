<!-- Salawat First-Visit Modal / تحية الصلاة على النبي ﷺ -->
<style>
  #salawat-modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 99999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    opacity: 0;
    transition: opacity 0.35s ease-in-out;
  }

  /* Default theme: GitHub Dark Slate Charcoal */
  #salawat-modal-card {
    position: relative;
    width: 100%;
    max-width: 410px;
    background: #000000;
    color: #c9d1d9;
    border: 1px solid #2f3336;
    border-radius: 14px;
    box-shadow: 0 16px 45px -10px rgba(1, 4, 9, 0.85), 0 0 0 1px rgba(240, 246, 252, 0.05);
    padding: 1.35rem 1.35rem 1.15rem;
    text-align: center;
    transform: scale(0.92) translateY(12px);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    overflow: hidden;
  }

  /* Light mode overrides */
  html[data-mode="light"] #salawat-modal-card,
  html[data-bs-theme="light"] #salawat-modal-card,
  body[data-mode="light"] #salawat-modal-card {
    background: #ffffff;
    border: 1px solid #d0d7de;
    box-shadow: 0 16px 40px -10px rgba(140, 149, 159, 0.25), 0 0 0 1px rgba(31, 35, 40, 0.05);
    color: #1f2328;
  }

  .salawat-glow {
    display: none;
  }

  .salawat-content {
    position: relative;
    z-index: 1;
  }

  .salawat-icon-wrapper {
    width: 42px;
    height: 42px;
    margin: 0 auto 0.65rem;
    border-radius: 50%;
    background: rgba(56, 189, 248, 0.08);
    border: 1.5px solid rgba(56, 189, 248, 0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #38bdf8;
    font-size: 1.15rem;
    box-shadow: 0 2px 10px rgba(56, 189, 248, 0.12);
  }

  html[data-mode="light"] .salawat-icon-wrapper,
  html[data-bs-theme="light"] .salawat-icon-wrapper {
    background: rgba(9, 105, 218, 0.08);
    border-color: rgba(9, 105, 218, 0.25);
    color: #0969da;
  }

  .salawat-title-ar {
    font-family: 'Cairo', 'Noto Sans Arabic', 'Amiri', 'Traditional Arabic', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 1.22rem;
    font-weight: 700;
    line-height: 1.35;
    color: #f0f6fc;
    margin-bottom: 0.45rem;
    letter-spacing: -0.01em;
  }

  html[data-mode="light"] .salawat-title-ar,
  html[data-bs-theme="light"] .salawat-title-ar {
    color: #1f2328;
  }

  .salawat-duaa-ar {
    font-family: 'Cairo', 'Noto Sans Arabic', 'Amiri', 'Traditional Arabic', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.85;
    color: #f0f6fc;
    margin-bottom: 0.75rem;
    padding: 0.55rem 0.85rem;
    background: rgba(56, 189, 248, 0.04);
    border-radius: 10px;
    border: 1px solid #2f3336;
  }

  html[data-mode="light"] .salawat-duaa-ar,
  html[data-bs-theme="light"] .salawat-duaa-ar {
    color: #1f2328;
    background: #f6f8fa;
    border-color: #d0d7de;
  }

  .salawat-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #2f3336, transparent);
    margin: 0.7rem auto;
    width: 60%;
  }

  html[data-mode="light"] .salawat-divider,
  html[data-bs-theme="light"] .salawat-divider {
    background: linear-gradient(90deg, transparent, #d0d7de, transparent);
  }

  .salawat-title-en {
    font-size: 0.76rem;
    font-weight: 600;
    color: #8b949e;
    margin-bottom: 0.2rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  html[data-mode="light"] .salawat-title-en,
  html[data-bs-theme="light"] .salawat-title-en {
    color: #57606a;
  }

  .salawat-subtitle-en {
    font-size: 0.78rem;
    color: #6e7681;
    line-height: 1.45;
    margin-bottom: 1rem;
  }

  html[data-mode="light"] .salawat-subtitle-en,
  html[data-bs-theme="light"] .salawat-subtitle-en {
    color: #656d76;
  }

  .salawat-btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    padding: 0.62rem 1.25rem;
    background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
    color: #ffffff !important;
    font-weight: 600;
    font-size: 0.88rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(35, 134, 54, 0.3);
    transition: all 0.2s ease;
    text-decoration: none !important;
  }

  .salawat-btn-primary:hover {
    background: linear-gradient(135deg, #2ea043 0%, #238636 100%);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
  }

  .salawat-btn-primary:active {
    transform: translateY(0);
  }

  .salawat-close-btn {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid #2f3336;
    color: #8b949e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    line-height: 1;
    cursor: pointer;
    transition: all 0.2s ease;
    z-index: 10;
  }

  .salawat-close-btn:hover {
    background: #16181c;
    color: #f0f6fc;
    border-color: #8b949e;
  }

  html[data-mode="light"] .salawat-close-btn,
  html[data-bs-theme="light"] .salawat-close-btn {
    border-color: #d0d7de;
    color: #656d76;
  }

  html[data-mode="light"] .salawat-close-btn:hover,
  html[data-bs-theme="light"] .salawat-close-btn:hover {
    background: #f3f4f6;
    color: #1f2328;
    border-color: #afb8c1;
  }

  @media (max-width: 576px) {
    #salawat-modal-card {
      padding: 1.25rem 1.1rem 1rem;
    }
    .salawat-title-ar {
      font-size: 1.15rem;
    }
    .salawat-duaa-ar {
      font-size: 0.86rem;
      line-height: 1.7;
    }
  }
</style>

<div id="salawat-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="salawat-modal-title">
  <div id="salawat-modal-card">
    <button type="button" class="salawat-close-btn" id="salawat-close-btn" aria-label="Close modal">&times;</button>
    <div class="salawat-glow"></div>
    <div class="salawat-content">
      <div class="salawat-icon-wrapper" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l2.4 5.3 5.6.8-4 4.1 1 5.8-5-2.8-5 2.8 1-5.8-4-4.1 5.6-.8z"></path>
        </svg>
      </div>

      <div id="salawat-modal-title" class="salawat-title-ar">صلِّ على سيدنا محمد ﷺ</div>
      <div class="salawat-duaa-ar" dir="rtl">
        اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا وَنَبِيِّنَا مُحَمَّدٍ، وَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِينَ
      </div>

      <div class="salawat-divider"></div>

      <div class="salawat-title-en">Peace &amp; Blessings Upon Prophet Muhammad</div>
      <div class="salawat-subtitle-en">
        May peace and blessings be upon our Prophet Muhammad, his family, and all his companions.
      </div>

      <button type="button" class="salawat-btn-primary" id="salawat-action-btn">
        <span dir="rtl">اللهم صلِّ وسلم عليه</span>
        <span style="opacity: 0.5;">&bull;</span>
        <span>Continue</span>
      </button>
    </div>
  </div>
</div>

<script>
  /* First-visit Salawat popup script: strictly runs once per visitor using localStorage */
  (function () {
    var STORAGE_KEY = 'salawat_welcomed_v1';

    function dismissModal() {
      try {
        localStorage.setItem(STORAGE_KEY, 'true');
      } catch (e) {
        /* In case localStorage is blocked in private browsing */
      }
      var backdrop = document.getElementById('salawat-modal-backdrop');
      var card = document.getElementById('salawat-modal-card');
      if (backdrop && card) {
        backdrop.style.opacity = '0';
        card.style.transform = 'scale(0.92) translateY(12px)';
        document.body.style.overflow = '';
        setTimeout(function () {
          backdrop.style.display = 'none';
        }, 360);
      }
    }

    function initSalawatModal() {
      var alreadySeen = false;
      try {
        alreadySeen = localStorage.getItem(STORAGE_KEY) === 'true';
      } catch (e) {
        alreadySeen = false;
      }

      /* If already acknowledged, do not show ever again */
      if (alreadySeen) {
        return;
      }

      var backdrop = document.getElementById('salawat-modal-backdrop');
      var card = document.getElementById('salawat-modal-card');
      var closeBtn = document.getElementById('salawat-close-btn');
      var actionBtn = document.getElementById('salawat-action-btn');

      if (!backdrop || !card) return;

      /* Gentle delay after initial page render so it does not interfere with load performance */
      setTimeout(function () {
        /* Re-check before showing in case another tab dismissed it */
        try {
          if (localStorage.getItem(STORAGE_KEY) === 'true') return;
          /* Mark immediately as seen so a refresh will NOT trigger it again */
          localStorage.setItem(STORAGE_KEY, 'true');
        } catch (e) {}

        backdrop.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        /* Trigger CSS transition */
        requestAnimationFrame(function () {
          backdrop.style.opacity = '1';
          card.style.transform = 'scale(1) translateY(0)';
        });
      }, 700);

      if (closeBtn) {
        closeBtn.addEventListener('click', dismissModal);
      }
      if (actionBtn) {
        actionBtn.addEventListener('click', dismissModal);
      }

      /* Close if user clicks outside the modal card */
      backdrop.addEventListener('click', function (e) {
        if (e.target === backdrop) {
          dismissModal();
        }
      });

      /* Close on Escape key */
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && backdrop.style.display === 'flex') {
          dismissModal();
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSalawatModal);
    } else {
      initSalawatModal();
    }
  })();
</script>
