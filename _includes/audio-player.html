{% unless page.audio == false %}
<!-- ==========================================================================
     AI Audio Narration / Voice Player Widget
     Executive High-Fidelity Audio Experience for Articles
     ========================================================================== -->

<div id="article-audio-player" class="audio-player-card my-4" data-audio-src="{{ page.audio | default: '' }}">
  <div class="audio-player-inner">
    <!-- Header: Badge & Status -->
    <div class="audio-player-header d-flex justify-content-between align-items-center mb-2">
      <div class="audio-badge d-inline-flex align-items-center">
        <span class="audio-icon-wrap me-2">
          <i class="fas fa-headphones-alt audio-main-icon"></i>
          <span class="audio-wave-anim d-none">
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
          </span>
        </span>
        <span class="audio-label fw-bold">Listen to Article</span>
        <span class="audio-engine-pill ms-2" id="audio-engine-badge">
          <i class="fas fa-robot me-1"></i>AI Narration
        </span>
      </div>

      <div class="audio-meta-wrap d-flex align-items-center gap-2">
        <span class="audio-speed-btn" id="audio-speed-toggle" title="Playback Speed" role="button" tabindex="0">1.0x</span>
        <button type="button" class="audio-btn-icon" id="audio-voice-select-btn" title="Select Voice" aria-label="Select Voice">
          <i class="fas fa-volume-up"></i>
        </button>
      </div>
    </div>

    <!-- Voice Selection Dropdown (Hidden by default) -->
    <div class="audio-voice-dropdown d-none mb-2" id="audio-voice-dropdown">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <span class="voice-picker-title"><i class="fas fa-sliders-h me-1"></i>Voice Model</span>
        <button type="button" class="btn-close-voice" id="btn-close-voice" aria-label="Close">&times;</button>
      </div>
      <select id="audio-voice-select" class="form-select form-select-sm" aria-label="Select AI Voice"></select>
    </div>

    <!-- Controls Row: Play/Pause, Scrubber, Time -->
    <div class="audio-controls-row d-flex align-items-center gap-3">
      <!-- Main Play/Pause Button -->
      <button type="button" class="audio-play-btn" id="audio-main-play-btn" aria-label="Play Narration">
        <i class="fas fa-play" id="audio-play-icon"></i>
      </button>

      <!-- Skip Buttons -->
      <button type="button" class="audio-skip-btn" id="audio-skip-back" title="Rewind 10 seconds" aria-label="Rewind 10s">
        <i class="fas fa-undo-alt"></i>
        <span class="skip-num">10</span>
      </button>
      <button type="button" class="audio-skip-btn" id="audio-skip-forward" title="Fast Forward 10 seconds" aria-label="Forward 10s">
        <i class="fas fa-redo-alt"></i>
        <span class="skip-num">10</span>
      </button>

      <!-- Scrubber Track & Times -->
      <div class="audio-scrubber-wrap flex-grow-1">
        <div class="audio-time-row d-flex justify-content-between mb-1">
          <span class="audio-time-current" id="audio-time-current">00:00</span>
          <span class="audio-time-total" id="audio-time-total">--:--</span>
        </div>
        <div class="audio-progress-container" id="audio-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="audio-progress-track">
            <div class="audio-progress-fill" id="audio-progress-fill" style="width: 0%;"></div>
            <div class="audio-progress-thumb" id="audio-progress-thumb" style="left: 0%;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Floating Mini Player (Visible when scrolling past main card while active) -->
<div id="audio-floating-bar" class="audio-floating-bar d-none">
  <div class="audio-floating-inner container d-flex align-items-center justify-content-between gap-3">
    <div class="d-flex align-items-center gap-2 overflow-hidden">
      <button type="button" class="audio-play-btn-mini" id="audio-mini-play-btn" aria-label="Play/Pause">
        <i class="fas fa-play" id="audio-mini-play-icon"></i>
      </button>
      <div class="mini-text-wrap text-truncate">
        <div class="mini-title text-truncate fw-bold">{{ page.title }}</div>
        <div class="mini-time" id="mini-time-display">00:00 / --:--</div>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span class="audio-speed-btn" id="mini-speed-toggle" role="button" tabindex="0">1.0x</span>
      <button type="button" class="audio-btn-icon-mini" id="audio-close-floating" title="Hide Mini Player" aria-label="Close">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>
</div>

<style>
  /* ==========================================================================

<script>
  /* ==========================================================================
     Dual-Mode Audio Engine: In-Browser Neural TTS & Audio Streamer
     ========================================================================== */
  (function () {
    const card = document.getElementById('article-audio-player');
    if (!card) return;

    const playBtn = document.getElementById('audio-main-play-btn');
    const playIcon = document.getElementById('audio-play-icon');
    const speedToggle = document.getElementById('audio-speed-toggle');
    const skipBack = document.getElementById('audio-skip-back');
    const skipFwd = document.getElementById('audio-skip-forward');
    const timeCurrent = document.getElementById('audio-time-current');
    const timeTotal = document.getElementById('audio-time-total');
    const progressBar = document.getElementById('audio-progress-bar');
    const progressFill = document.getElementById('audio-progress-fill');
    const progressThumb = document.getElementById('audio-progress-thumb');
    const voiceSelectBtn = document.getElementById('audio-voice-select-btn');
    const voiceDropdown = document.getElementById('audio-voice-dropdown');
    const voiceSelect = document.getElementById('audio-voice-select');
    const btnCloseVoice = document.getElementById('btn-close-voice');
    const waveAnim = card.querySelector('.audio-wave-anim');
    const mainIcon = card.querySelector('.audio-main-icon');

    // Mini Floating Elements
    const floatingBar = document.getElementById('audio-floating-bar');
    const miniPlayBtn = document.getElementById('audio-mini-play-btn');
    const miniPlayIcon = document.getElementById('audio-mini-play-icon');
    const miniTime = document.getElementById('mini-time-display');
    const miniSpeedToggle = document.getElementById('mini-speed-toggle');
    const closeFloating = document.getElementById('audio-close-floating');

    const speeds = [1.0, 1.25, 1.5, 2.0, 0.8];
    let currentSpeedIdx = 0;
    let isPlaying = false;
    let audioMode = 'tts'; // 'file' or 'tts'
    let audioElement = null;

    // SpeechSynthesis TTS State
    let synth = window.speechSynthesis;
    let availableVoices = [];
    let selectedVoice = null;
    let textChunks = [];
    let currentChunkIdx = 0;
    let totalEstimatedSeconds = 0;
    let elapsedSeconds = 0;
    let timerInterval = null;

    // 1. Check if post has a dedicated audio file
    const staticSrc = card.getAttribute('data-audio-src');
    if (staticSrc && staticSrc.trim().length > 4) {
      audioMode = 'file';
      document.getElementById('audio-engine-badge').innerHTML = '<i class="fas fa-file-audio me-1"></i>Studio Audio';
      initAudioElement(staticSrc.trim());
    } else {
      audioMode = 'tts';
      initTTS();
    }

    // -------------------------------------------------------------
    // Mode A: File Audio Element
    // -------------------------------------------------------------
    function initAudioElement(src) {
      audioElement = new Audio(src);
      audioElement.preload = 'metadata';

      audioElement.addEventListener('loadedmetadata', () => {
        timeTotal.innerText = formatTime(audioElement.duration);
        updateProgress(0, audioElement.duration);
      });

      audioElement.addEventListener('timeupdate', () => {
        timeCurrent.innerText = formatTime(audioElement.currentTime);
        updateProgress(audioElement.currentTime, audioElement.duration);
        if (miniTime) miniTime.innerText = `${formatTime(audioElement.currentTime)} / ${formatTime(audioElement.duration)}`;
      });

      audioElement.addEventListener('ended', () => {
        stopPlayback();
      });
    }

    // -------------------------------------------------------------
    // Mode B: Intelligent Text Extraction for In-Browser TTS
    // -------------------------------------------------------------
    function initTTS() {
      if (!('speechSynthesis' in window)) {
        card.style.display = 'none';
        return;
      }

      // Populate Voices
      function populateVoices() {
        availableVoices = synth.getVoices();
        // Filter English voices
        const englishVoices = availableVoices.filter(v => v.lang.startsWith('en'));
        const voicesToUse = englishVoices.length > 0 ? englishVoices : availableVoices;

        voiceSelect.innerHTML = '';
        voicesToUse.forEach((v, i) => {
          const opt = document.createElement('option');
          opt.value = v.name;
          opt.textContent = `${v.name} (${v.lang})`;
          // Prefer natural / neural voices
          if (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Daniel')) {
            if (!selectedVoice) selectedVoice = v;
          }
          voiceSelect.appendChild(opt);
        });

        if (!selectedVoice && voicesToUse.length > 0) {
          selectedVoice = voicesToUse[0];
        }

        if (selectedVoice) {
          voiceSelect.value = selectedVoice.name;
        }
      }

      populateVoices();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoices;
      }

      voiceSelect.addEventListener('change', () => {
        selectedVoice = availableVoices.find(v => v.name === voiceSelect.value);
        if (isPlaying) {
          restartFromCurrentChunk();
        }
      });

      // Extract Clean Prose Text from Article
      extractArticleChunks();
    }

    function extractArticleChunks() {
      const contentElem = document.querySelector('.content') || document.querySelector('article');
      if (!contentElem) return;

      // Clone content node to sanitize without DOM modification
      const clone = contentElem.cloneNode(true);

      // Strip elements that shouldn't be read out loud
      const removeSelectors = [
        'pre', 'code', 'table', '.mermaid', 'svg', 
        '.series-nav', '.series-nav-bottom', '#toc-bar', 
        '.post-stats-bar', '.audio-player-card', '.audio-floating-bar',
        '.post-tail-wrapper', 'figure', 'figcaption', 'script', 'style'
      ];
      removeSelectors.forEach(sel => {
        clone.querySelectorAll(sel).forEach(el => el.remove());
      });

      // Extract paragraphs and headings
      const nodes = clone.querySelectorAll('h1, h2, h3, h4, p, li, blockquote');
      textChunks = [];
      let totalWordCount = 0;

      nodes.forEach(node => {
        const text = node.innerText.trim();
        if (text.length > 10 && !text.startsWith('---')) {
          // Break into sentence chunks of max ~180 characters for TTS stability
          const sentences = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
          sentences.forEach(s => {
            const cleanS = s.trim();
            if (cleanS.length > 3) {
              textChunks.push(cleanS);
              totalWordCount += cleanS.split(/\s+/).length;
            }
          });
        }
      });

      // Estimate duration: ~150 words per minute average TTS speech
      totalEstimatedSeconds = Math.max(30, Math.round((totalWordCount / 150) * 60));
      timeTotal.innerText = formatTime(totalEstimatedSeconds);
    }

    function playTTSChunk(index) {
      if (!synth || index >= textChunks.length) {
        stopPlayback();
        return;
      }

      currentChunkIdx = index;
      synth.cancel(); // Stop ongoing utterance

      const text = textChunks[currentChunkIdx];
      const utterance = new SpeechSynthesisUtterance(text);
      if (selectedVoice) utterance.voice = selectedVoice;
      utterance.rate = speeds[currentSpeedIdx];
      utterance.pitch = 1.0;

      utterance.onend = () => {
        if (isPlaying && currentChunkIdx < textChunks.length - 1) {
          playTTSChunk(currentChunkIdx + 1);
        } else if (currentChunkIdx >= textChunks.length - 1) {
          stopPlayback();
        }
      };

      utterance.onerror = (e) => {
        if (e.error !== 'interrupted' && e.error !== 'canceled') {
          console.warn('TTS Utterance error:', e);
        }
      };

      synth.speak(utterance);
    }

    function restartFromCurrentChunk() {
      if (isPlaying) {
        synth.cancel();
        playTTSChunk(currentChunkIdx);
      }
    }

    // -------------------------------------------------------------
    // Core Playback State Handlers
    // -------------------------------------------------------------
    function togglePlayback() {
      if (isPlaying) {
        pausePlayback();
      } else {
        startPlayback();
      }
    }

    function startPlayback() {
      isPlaying = true;
      playIcon.className = 'fas fa-pause';
      if (miniPlayIcon) miniPlayIcon.className = 'fas fa-pause';
      playBtn.classList.add('is-playing');
      waveAnim.classList.remove('d-none');
      mainIcon.classList.add('d-none');

      if (audioMode === 'file' && audioElement) {
        audioElement.playbackRate = speeds[currentSpeedIdx];
        audioElement.play();
      } else {
        if (synth.paused) {
          synth.resume();
        } else {
          playTTSChunk(currentChunkIdx);
        }
        startTimer();
      }
    }

    function pausePlayback() {
      isPlaying = false;
      playIcon.className = 'fas fa-play';
      if (miniPlayIcon) miniPlayIcon.className = 'fas fa-play';
      playBtn.classList.remove('is-playing');
      waveAnim.classList.add('d-none');
      mainIcon.classList.remove('d-none');

      if (audioMode === 'file' && audioElement) {
        audioElement.pause();
      } else {
        if (synth) synth.pause();
        stopTimer();
      }
    }

    function stopPlayback() {
      isPlaying = false;
      currentChunkIdx = 0;
      elapsedSeconds = 0;
      playIcon.className = 'fas fa-play';
      if (miniPlayIcon) miniPlayIcon.className = 'fas fa-play';
      playBtn.classList.remove('is-playing');
      waveAnim.classList.add('d-none');
      mainIcon.classList.remove('d-none');
      timeCurrent.innerText = '00:00';
      updateProgress(0, totalEstimatedSeconds);

      if (audioMode === 'file' && audioElement) {
        audioElement.pause();
        audioElement.currentTime = 0;
      } else {
        if (synth) synth.cancel();
        stopTimer();
      }
    }

    function startTimer() {
      stopTimer();
      timerInterval = setInterval(() => {
        if (isPlaying) {
          elapsedSeconds++;
          const effectiveTotal = Math.max(elapsedSeconds, Math.round(totalEstimatedSeconds / speeds[currentSpeedIdx]));
          timeCurrent.innerText = formatTime(elapsedSeconds);
          timeTotal.innerText = formatTime(effectiveTotal);
          updateProgress(elapsedSeconds, effectiveTotal);
          if (miniTime) miniTime.innerText = `${formatTime(elapsedSeconds)} / ${formatTime(effectiveTotal)}`;
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
    }

    function updateProgress(current, total) {
      if (!total || total <= 0) return;
      const pct = Math.min(100, Math.max(0, (current / total) * 100));
      progressFill.style.width = `${pct}%`;
      progressThumb.style.left = `${pct}%`;
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '00:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // -------------------------------------------------------------
    // UI Event Listeners
    // -------------------------------------------------------------
    playBtn.addEventListener('click', togglePlayback);
    if (miniPlayBtn) miniPlayBtn.addEventListener('click', togglePlayback);

    // Speed Toggle
    function cycleSpeed() {
      currentSpeedIdx = (currentSpeedIdx + 1) % speeds.length;
      const spd = speeds[currentSpeedIdx];
      const label = `${spd.toFixed(1)}x`;
      speedToggle.innerText = label;
      if (miniSpeedToggle) miniSpeedToggle.innerText = label;

      if (audioMode === 'file' && audioElement) {
        audioElement.playbackRate = spd;
      } else if (isPlaying) {
        restartFromCurrentChunk();
      }
    }

    speedToggle.addEventListener('click', cycleSpeed);
    if (miniSpeedToggle) miniSpeedToggle.addEventListener('click', cycleSpeed);

    // Skip Back / Forward
    skipBack.addEventListener('click', () => {
      if (audioMode === 'file' && audioElement) {
        audioElement.currentTime = Math.max(0, audioElement.currentTime - 10);
      } else {
        currentChunkIdx = Math.max(0, currentChunkIdx - 2);
        elapsedSeconds = Math.max(0, elapsedSeconds - 10);
        if (isPlaying) restartFromCurrentChunk();
      }
    });

    skipFwd.addEventListener('click', () => {
      if (audioMode === 'file' && audioElement) {
        audioElement.currentTime = Math.min(audioElement.duration, audioElement.currentTime + 10);
      } else {
        currentChunkIdx = Math.min(textChunks.length - 1, currentChunkIdx + 2);
        elapsedSeconds += 10;
        if (isPlaying) restartFromCurrentChunk();
      }
    });

    // Scrubber click/seek
    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const clickPos = (e.clientX - rect.left) / rect.width;
      const targetPercent = Math.max(0, Math.min(1, clickPos));

      if (audioMode === 'file' && audioElement && audioElement.duration) {
        audioElement.currentTime = targetPercent * audioElement.duration;
      } else if (textChunks.length > 0) {
        currentChunkIdx = Math.floor(targetPercent * textChunks.length);
        elapsedSeconds = Math.round(targetPercent * totalEstimatedSeconds);
        if (isPlaying) {
          restartFromCurrentChunk();
        } else {
          timeCurrent.innerText = formatTime(elapsedSeconds);
          updateProgress(elapsedSeconds, totalEstimatedSeconds);
        }
      }
    });

    // Voice Picker Toggle
    voiceSelectBtn.addEventListener('click', () => {
      voiceDropdown.classList.toggle('d-none');
    });

    if (btnCloseVoice) {
      btnCloseVoice.addEventListener('click', () => {
        voiceDropdown.classList.add('d-none');
      });
    }

    // Floating Mini Bar on Scroll
    let observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        // If main card is not visible AND audio is playing, show floating mini bar
        if (!entry.isIntersecting && isPlaying) {
          floatingBar.classList.remove('d-none');
        } else {
          floatingBar.classList.add('d-none');
        }
      });
    }, { threshold: 0.1 });

    observer.observe(card);

    if (closeFloating) {
      closeFloating.addEventListener('click', () => {
        floatingBar.classList.add('d-none');
      });
    }

    // Stop audio on page leave/unload
    function handleUnload() {
      if (synth) synth.cancel();
      if (audioElement) audioElement.pause();
    }
    window.addEventListener('beforeunload', handleUnload);
    window.addEventListener('pagehide', handleUnload);
  })();
</script>
{% endunless %}
