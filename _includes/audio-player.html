{% unless page.audio == false %}
<!-- ==========================================================================
     Minimalist High-Fidelity Audio Player Widget
     Clean, compact, editorial listening experience
     ========================================================================== -->

<div id="article-audio-player" class="audio-player-card my-3" data-audio-src="{{ page.audio | default: '' }}">
  <div class="audio-player-inner d-flex align-items-center gap-3">
    <!-- Play/Pause Button -->
    <button type="button" class="audio-main-play-btn" id="audio-main-play-btn" aria-label="Play Narration">
      <i class="fas fa-play" id="audio-play-icon"></i>
    </button>

    <!-- Center Module: Info Row & Progress Track -->
    <div class="audio-main-body flex-grow-1 overflow-hidden">
      <!-- Title, Duration & Live Timestamp -->
      <div class="audio-info-row d-flex justify-content-between align-items-center mb-1">
        <div class="d-flex align-items-center gap-2 overflow-hidden text-truncate">
          <span class="audio-title fw-semibold text-truncate" id="audio-main-label">Listen to article</span>
          <span class="audio-dot text-muted">&bull;</span>
          <span class="audio-duration text-muted" id="audio-duration-estimate">-- min</span>
          
          <!-- Animated soundwave (active when playing) -->
          <span class="audio-wave-anim d-none ms-1" id="audio-wave-bars">
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
          </span>
        </div>

        <div class="audio-time-cluster flex-shrink-0 font-monospace">
          <span class="time-cur" id="audio-time-current">00:00</span>
          <span class="time-sep">/</span>
          <span class="time-tot" id="audio-time-total">--:--</span>
        </div>
      </div>

      <!-- Scrubber Track -->
      <div class="audio-track-wrap" id="audio-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="audio-track-line">
          <div class="audio-track-progress" id="audio-track-fill"></div>
          <div class="audio-track-thumb" id="audio-track-thumb"></div>
        </div>
        <div class="audio-hover-tooltip d-none" id="audio-hover-tooltip">00:00</div>
      </div>
    </div>

    <!-- Quick Action Controls -->
    <div class="audio-actions-cluster d-flex align-items-center gap-1 flex-shrink-0">
      <!-- Rewind 10s -->
      <button type="button" class="audio-btn-sub d-none d-sm-inline-flex" id="audio-skip-back" title="Rewind 10s (←)" aria-label="Rewind 10s">
        <i class="fas fa-undo-alt"></i>
      </button>

      <!-- Forward 10s -->
      <button type="button" class="audio-btn-sub d-none d-sm-inline-flex" id="audio-skip-forward" title="Forward 10s (→)" aria-label="Forward 10s">
        <i class="fas fa-redo-alt"></i>
      </button>

      <!-- Speed Toggle -->
      <button type="button" class="audio-btn-speed" id="audio-speed-toggle" title="Playback speed" aria-label="Speed">
        <span id="speed-label">1.0x</span>
      </button>

      <!-- Voice Selector / Options -->
      <button type="button" class="audio-btn-sub" id="audio-voice-btn" title="Select Voice" aria-label="Voice">
        <i class="fas fa-sliders-h" id="audio-voice-icon"></i>
      </button>

      <!-- Mute Toggle -->
      <button type="button" class="audio-btn-sub" id="audio-volume-btn" title="Mute/Unmute (M)" aria-label="Volume">
        <i class="fas fa-volume-up" id="audio-volume-icon"></i>
      </button>
    </div>
  </div>

  <!-- Voice Select Popover (Compact) -->
  <div class="audio-voice-popover d-none mt-2 pt-2 border-top" id="audio-voice-drawer">
    <div class="d-flex justify-content-between align-items-center mb-1">
      <span class="voice-popover-title text-muted small"><i class="fas fa-user-astronaut me-1"></i>Voice Model</span>
      <button type="button" class="voice-popover-close btn-close-custom" id="drawer-close-btn" aria-label="Close">&times;</button>
    </div>
    <select id="audio-voice-select" class="form-select form-select-sm audio-voice-select-box" aria-label="Select Voice"></select>
  </div>
</div>

<!-- ==========================================================================
     Floating Mini Sticky Pill (Clean & Minimal)
     ========================================================================== -->
<div id="audio-floating-pill" class="audio-floating-pill d-none">
  <div class="floating-progress-line">
    <div class="floating-progress-fill" id="floating-progress-fill"></div>
  </div>

  <div class="floating-pill-content d-flex align-items-center justify-content-between gap-3">
    <div class="d-flex align-items-center gap-2 overflow-hidden flex-grow-1">
      <button type="button" class="floating-mini-play-btn" id="floating-play-btn" aria-label="Play/Pause">
        <i class="fas fa-play" id="floating-play-icon"></i>
      </button>
      <div class="floating-title text-truncate fw-medium">{{ page.title }}</div>
    </div>

    <div class="d-flex align-items-center gap-2 flex-shrink-0">
      <span class="floating-time font-monospace" id="floating-time">00:00 / --:--</span>
      <button type="button" class="audio-btn-speed audio-btn-speed-mini" id="floating-speed-toggle">1.0x</button>
      <button type="button" class="floating-close-btn" id="floating-close-btn" aria-label="Close">&times;</button>
    </div>
  </div>
</div>

<style>
  /* ==========================================================================
     Audio Player Styling: Minimal, Clean, High-End Tech Aesthetic
     ========================================================================== */
  .audio-player-card {
    background: #0d1117;
    border: 1px solid rgba(88, 166, 255, 0.18);
    border-radius: 12px;
    padding: 0.75rem 1rem;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .audio-player-card:hover {
    border-color: rgba(88, 166, 255, 0.35);
  }

  /* Light Mode */
  html[data-mode="light"] .audio-player-card,
  html[data-bs-theme="light"] .audio-player-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
  }

  html[data-mode="light"] .audio-player-card:hover,
  html[data-bs-theme="light"] .audio-player-card:hover {
    border-color: #cbd5e1;
  }

  /* Play Button */
  .audio-main-play-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #58a6ff;
    color: #0d1117;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease, background-color 0.15s ease;
  }

  .audio-main-play-btn:hover {
    transform: scale(1.06);
    background: #79b8ff;
  }

  .audio-main-play-btn:active {
    transform: scale(0.96);
  }

  .audio-main-play-btn.is-playing {
    background: #2ea043;
    color: #ffffff;
  }

  .audio-main-play-btn.is-playing:hover {
    background: #3fb950;
  }

  html[data-mode="light"] .audio-main-play-btn {
    background: #0969da;
    color: #ffffff;
  }

  html[data-mode="light"] .audio-main-play-btn:hover {
    background: #0860ca;
  }

  html[data-mode="light"] .audio-main-play-btn.is-playing {
    background: #1a7f37;
  }

  /* Title & Meta Row */
  .audio-title {
    font-size: 0.88rem;
    color: #e6edf3;
    letter-spacing: -0.01em;
  }

  html[data-mode="light"] .audio-title,
  html[data-bs-theme="light"] .audio-title {
    color: #1f2328;
  }

  .audio-dot {
    font-size: 0.75rem;
    opacity: 0.5;
  }

  .audio-duration {
    font-size: 0.76rem;
  }

  .audio-time-cluster {
    font-size: 0.74rem;
    color: #8b949e;
  }

  .time-cur {
    color: #58a6ff;
  }

  html[data-mode="light"] .time-cur,
  html[data-bs-theme="light"] .time-cur {
    color: #0969da;
  }

  .time-sep {
    margin: 0 2px;
    opacity: 0.4;
  }

  /* Soundwave Animation */
  .audio-wave-anim {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
  }

  .audio-wave-anim .wave-bar {
    width: 2px;
    background: #58a6ff;
    border-radius: 1px;
    animation: simpleWave 1s ease-in-out infinite;
  }

  .wave-bar:nth-child(1) { height: 4px; animation-delay: 0.1s; }
  .wave-bar:nth-child(2) { height: 11px; animation-delay: 0.25s; }
  .wave-bar:nth-child(3) { height: 6px; animation-delay: 0.4s; }

  @keyframes simpleWave {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  /* Scrubber Track */
  .audio-track-wrap {
    position: relative;
    width: 100%;
    height: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    touch-action: none;
  }

  .audio-track-line {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    position: relative;
    transition: height 0.15s ease;
  }

  .audio-track-wrap:hover .audio-track-line {
    height: 6px;
  }

  html[data-mode="light"] .audio-track-line,
  html[data-bs-theme="light"] .audio-track-line {
    background: #e2e8f0;
  }

  .audio-track-progress {
    height: 100%;
    width: 0%;
    background: #58a6ff;
    border-radius: 2px;
  }

  html[data-mode="light"] .audio-track-progress,
  html[data-bs-theme="light"] .audio-track-progress {
    background: #0969da;
  }

  .audio-track-thumb {
    position: absolute;
    top: 50%;
    left: 0%;
    transform: translate(-50%, -50%);
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    opacity: 0;
    transition: opacity 0.15s ease;
    pointer-events: none;
  }

  .audio-track-wrap:hover .audio-track-thumb {
    opacity: 1;
  }

  .audio-hover-tooltip {
    position: absolute;
    bottom: 16px;
    transform: translateX(-50%);
    background: #161b22;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #f0f6fc;
    font-size: 0.65rem;
    font-family: var(--font-family-monospace, monospace);
    padding: 0.1rem 0.35rem;
    border-radius: 4px;
    pointer-events: none;
    z-index: 10;
  }

  /* Utility Buttons */
  .audio-btn-sub {
    background: transparent;
    border: none;
    color: #8b949e;
    font-size: 0.82rem;
    padding: 0.3rem 0.4rem;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease, background-color 0.15s ease;
  }

  .audio-btn-sub:hover {
    color: #58a6ff;
    background: rgba(88, 166, 255, 0.08);
  }

  html[data-mode="light"] .audio-btn-sub,
  html[data-bs-theme="light"] .audio-btn-sub {
    color: #656d76;
  }

  html[data-mode="light"] .audio-btn-sub:hover,
  html[data-bs-theme="light"] .audio-btn-sub:hover {
    color: #0969da;
    background: #f0f3f6;
  }

  .audio-btn-speed {
    font-size: 0.72rem;
    font-weight: 600;
    font-family: var(--font-family-monospace, monospace);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #c9d1d9;
    padding: 0.18rem 0.45rem;
    border-radius: 6px;

    transition: all 0.15s ease;

  .audio-btn-speed:hover {
    color: #58a6ff;
    border-color: #58a6ff;
    background: rgba(88, 166, 255, 0.12);
  }

  html[data-mode="light"] .audio-btn-speed,
  html[data-bs-theme="light"] .audio-btn-speed {
    background: #eef2f6;
    border-color: #d0d7de;
    color: #24292f;
  }

  html[data-mode="light"] .audio-btn-speed:hover,
  html[data-bs-theme="light"] .audio-btn-speed:hover {
    background: #dbeafe;
    border-color: #0969da;
    color: #0969da;

  /* Popover */
  .voice-popover-title {
    font-size: 0.75rem;
  }

  .btn-close-custom {
    background: none;
    border: none;
    color: #8b949e;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }

  .audio-voice-select-box {
    background: #161b22;
    border-color: rgba(255, 255, 255, 0.15);
    color: #c9d1d9;
    font-size: 0.78rem;
  }

  html[data-mode="light"] .audio-voice-select-box,
  html[data-bs-theme="light"] .audio-voice-select-box {
    background: #ffffff;
    border-color: #d0d7de;
    color: #1f2328;
  }

  /* Floating Sticky Bar */
  .audio-floating-pill {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 540px;
    background: rgba(13, 17, 23, 0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(88, 166, 255, 0.25);
    border-radius: 28px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    z-index: 1060;
    overflow: hidden;
    animation: pillSlideUp 0.25s ease-out;
  }

  @keyframes pillSlideUp {
    from { transform: translate(-50%, 30px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }

  html[data-mode="light"] .audio-floating-pill,
  html[data-bs-theme="light"] .audio-floating-pill {
    background: rgba(255, 255, 255, 0.96);
    border-color: #d0d7de;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
  }

  .floating-progress-line {
    height: 2px;
    width: 100%;
    background: rgba(255, 255, 255, 0.08);
  }

  .floating-progress-fill {
    height: 100%;
    width: 0%;
    background: #58a6ff;
  }

  html[data-mode="light"] .floating-progress-fill {
    background: #0969da;
  }

  .floating-pill-content {
    padding: 0.5rem 0.9rem;
  }

  .floating-mini-play-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #58a6ff;
    color: #0d1117;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    cursor: pointer;
    flex-shrink: 0;
  }

  html[data-mode="light"] .floating-mini-play-btn {
    background: #0969da;
    color: #ffffff;
  }

  .floating-title {
    font-size: 0.8rem;
    color: #e6edf3;
  }

  html[data-mode="light"] .floating-title,
  html[data-bs-theme="light"] .floating-title {
    color: #1f2328;
  }

  .floating-time {
    font-size: 0.7rem;
    color: #8b949e;
  }

  .audio-btn-speed-mini {
    padding: 0.12rem 0.35rem;
    font-size: 0.68rem;
  }

  .floating-close-btn {
    background: none;
    border: none;
    color: #8b949e;
    font-size: 1rem;
    cursor: pointer;
    line-height: 1;
    padding: 0 0.2rem;
  }

  .floating-close-btn:hover {
    color: #f85149;
  }
</style>

<script>
  /* ==========================================================================
     Minimal Audio Narration Engine
     ========================================================================== */
  function initAudioWidget() {
    const card = document.getElementById('article-audio-player');
    if (!card) return;

    // Controls
    const playBtn = document.getElementById('audio-main-play-btn');
    const playIcon = document.getElementById('audio-play-icon');
    const speedToggle = document.getElementById('audio-speed-toggle');
    const speedLabel = document.getElementById('speed-label');
    const skipBack = document.getElementById('audio-skip-back');
    const skipFwd = document.getElementById('audio-skip-forward');
    const timeCurrent = document.getElementById('audio-time-current');
    const timeTotal = document.getElementById('audio-time-total');
    const track = document.getElementById('audio-track');
    const trackFill = document.getElementById('audio-track-fill');
    const trackThumb = document.getElementById('audio-track-thumb');
    const hoverTooltip = document.getElementById('audio-hover-tooltip');
    const waveBars = document.getElementById('audio-wave-bars');
    const voiceBtn = document.getElementById('audio-voice-btn');
    const voiceDrawer = document.getElementById('audio-voice-drawer');
    const voiceSelect = document.getElementById('audio-voice-select');
    const drawerCloseBtn = document.getElementById('drawer-close-btn');
    const volumeBtn = document.getElementById('audio-volume-btn');
    const volumeIcon = document.getElementById('audio-volume-icon');
    const mainLabel = document.getElementById('audio-main-label');
    const durationEstimate = document.getElementById('audio-duration-estimate');

    // Floating Pill Elements
    const floatingPill = document.getElementById('audio-floating-pill');
    const floatingPlayBtn = document.getElementById('floating-play-btn');
    const floatingPlayIcon = document.getElementById('floating-play-icon');
    const floatingTime = document.getElementById('floating-time');
    const floatingProgressFill = document.getElementById('floating-progress-fill');
    const floatingSpeedToggle = document.getElementById('floating-speed-toggle');
    const floatingCloseBtn = document.getElementById('floating-close-btn');

    const speeds = [1.0, 1.25, 1.5, 2.0, 0.8];
    let speedIdx = 0;
    let isPlaying = false;
    let isMuted = false;
    let audioMode = 'tts';
    let audioElement = null;

    // TTS state
    const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
    let availableVoices = [];
    let selectedVoice = null;
    let textChunks = [];
    let currentChunkIdx = 0;
    let totalWordCount = 0;
    let totalEstimatedSeconds = 0;
    let elapsedSeconds = 0;
    let timerInterval = null;
    let keepAliveInterval = null;
    let isDragging = false;
    let isArabic = false;

    // Check mode
    const staticSrc = card.getAttribute('data-audio-src');
    if (staticSrc && staticSrc.trim().length > 4) {
      audioMode = 'file';
      initAudioElement(staticSrc.trim());
    } else {
      audioMode = 'tts';
      initTTS();
    }

    // -------------------------------------------------------------
    // Mode A: File Streaming
    // -------------------------------------------------------------
    function initAudioElement(src) {
      audioElement = new Audio(src);
      audioElement.preload = 'metadata';

      audioElement.addEventListener('loadedmetadata', () => {
        totalEstimatedSeconds = Math.round(audioElement.duration);
        timeTotal.innerText = formatTime(totalEstimatedSeconds);
        if (durationEstimate) durationEstimate.innerText = `${Math.ceil(totalEstimatedSeconds / 60)} min`;
        updateScrubber(0, totalEstimatedSeconds);
      });

      audioElement.addEventListener('timeupdate', () => {
        if (!isDragging) {
          elapsedSeconds = Math.round(audioElement.currentTime);
          timeCurrent.innerText = formatTime(elapsedSeconds);
          updateScrubber(audioElement.currentTime, audioElement.duration);
          if (floatingTime) {
            floatingTime.innerText = `${formatTime(elapsedSeconds)} / ${formatTime(totalEstimatedSeconds)}`;
          }
        }
      });

      audioElement.addEventListener('ended', stopPlayback);
    }

    // -------------------------------------------------------------
    // Mode B: Clean Text & TTS
    // -------------------------------------------------------------
    function initTTS() {
      extractArticleChunks();
      if (textChunks.length === 0) {
        setTimeout(extractArticleChunks, 400);
      }

      function loadVoices() {
        if (!synth) return;
        availableVoices = synth.getVoices();
        if (!availableVoices || availableVoices.length === 0) return;

        let filtered = isArabic 
          ? availableVoices.filter(v => v.lang.startsWith('ar'))
          : availableVoices.filter(v => v.lang.startsWith('en'));

        const list = filtered.length > 0 ? filtered : availableVoices;

        voiceSelect.innerHTML = '';
        list.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.name;
          opt.textContent = `${v.name} (${v.lang})`;
          if (!selectedVoice) {
            const l = v.name.toLowerCase();
            if (l.includes('natural') || l.includes('google') || l.includes('samantha') || l.includes('daniel')) {
              selectedVoice = v;
            }
          }
          voiceSelect.appendChild(opt);
        });

        if (!selectedVoice && list.length > 0) selectedVoice = list[0];
        if (selectedVoice) voiceSelect.value = selectedVoice.name;
      }

      loadVoices();
      if (speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
      }

      voiceSelect.addEventListener('change', () => {
        selectedVoice = availableVoices.find(v => v.name === voiceSelect.value);
        if (isPlaying) restartCurrentChunk();
      });
    }

    function extractArticleChunks() {
      const contentElem = document.querySelector('.content') || 
                          document.querySelector('.page-content') || 
                          document.querySelector('article');
      if (!contentElem) return;

      const clone = contentElem.cloneNode(true);
      const removeSelectors = [
        'pre', 'code', 'table', '.mermaid', 'svg', 
        '.series-nav', '.series-nav-bottom', '#toc-bar', 
        '.post-stats-bar', '.audio-player-card', '.audio-floating-pill',
        '.post-tail-wrapper', 'figure', 'figcaption', 'script', 'style', 'nav'
      ];
      removeSelectors.forEach(sel => {
        clone.querySelectorAll(sel).forEach(el => el.remove());
      });

      const nodes = clone.querySelectorAll('h1, h2, h3, h4, p, li, blockquote');
      textChunks = [];
      totalWordCount = 0;
      let arCount = 0;
      let totalChars = 0;

      nodes.forEach(node => {
        let text = node.innerText.trim();
        text = text.replace(/\[\^?[^\]]+\]/g, '')
                   .replace(/https?:\/\/\S+/g, '')
                   .replace(/^[\s*#>~-]+/g, '')
                   .trim();

        if (text.length > 10 && !text.startsWith('---')) {
          for (let i = 0; i < text.length; i++) {
            const c = text.charCodeAt(i);
            if (c >= 0x0600 && c <= 0x06FF) arCount++;
            totalChars++;
          }

          const sentences = text.match(/[^.!?؟]+[.!?؟]+(\s|$)|[^.!?؟]+$/g) || [text];
          sentences.forEach(s => {
            const clean = s.trim();
            if (clean.length > 3) {
              textChunks.push(clean);
              totalWordCount += clean.split(/\s+/).length;
            }
          });
        }
      });

      if (totalChars > 40 && (arCount / totalChars) > 0.25) {
        isArabic = true;
        if (mainLabel) mainLabel.innerText = 'استمع للمقال';
      }

      totalEstimatedSeconds = Math.max(30, Math.round((totalWordCount / 145) * 60));
      timeTotal.innerText = formatTime(totalEstimatedSeconds);

      if (durationEstimate) {
        const mins = Math.max(1, Math.round(totalEstimatedSeconds / 60));
        durationEstimate.innerText = isArabic ? `${mins} دقيقة` : `${mins} min`;
      }
    }

    function playTTSChunk(index) {
      if (!synth || index >= textChunks.length) {
        stopPlayback();
        return;
      }

      currentChunkIdx = index;
      synth.cancel();

      const text = textChunks[currentChunkIdx];
      const utterance = new SpeechSynthesisUtterance(text);
      if (selectedVoice) utterance.voice = selectedVoice;
      utterance.rate = speeds[speedIdx];
      utterance.pitch = 1.0;
      utterance.volume = isMuted ? 0 : 1;

      utterance.onend = () => {
        if (isPlaying && currentChunkIdx < textChunks.length - 1) {
          playTTSChunk(currentChunkIdx + 1);
        } else if (currentChunkIdx >= textChunks.length - 1) {
          stopPlayback();
        }
      };

      utterance.onerror = (e) => {
        if (e.error !== 'interrupted' && e.error !== 'canceled') {
          console.warn('TTS error:', e);
        }
      };

      synth.speak(utterance);
    }

    function restartCurrentChunk() {
      if (isPlaying) {
        synth.cancel();
        playTTSChunk(currentChunkIdx);
      }
    }

    // -------------------------------------------------------------
    // Core Controls
    // -------------------------------------------------------------
    function togglePlayback() {
      if (isPlaying) pausePlayback();
      else startPlayback();
    }

    function startPlayback() {
      isPlaying = true;
      playIcon.className = 'fas fa-pause';
      if (floatingPlayIcon) floatingPlayIcon.className = 'fas fa-pause';
      playBtn.classList.add('is-playing');
      waveBars.classList.remove('d-none');

      if (audioMode === 'file' && audioElement) {
        audioElement.playbackRate = speeds[speedIdx];
        audioElement.muted = isMuted;
        audioElement.play();
      } else {
        if (synth && synth.paused) {
          synth.resume();
        } else {
          playTTSChunk(currentChunkIdx);
        }
        startTimers();
      }
    }

    function pausePlayback() {
      isPlaying = false;
      playIcon.className = 'fas fa-play';
      if (floatingPlayIcon) floatingPlayIcon.className = 'fas fa-play';
      playBtn.classList.remove('is-playing');
      waveBars.classList.add('d-none');

      if (audioMode === 'file' && audioElement) {
        audioElement.pause();
      } else {
        if (synth) synth.pause();
        stopTimers();
      }
    }

    function stopPlayback() {
      isPlaying = false;
      currentChunkIdx = 0;
      elapsedSeconds = 0;
      playIcon.className = 'fas fa-play';
      if (floatingPlayIcon) floatingPlayIcon.className = 'fas fa-play';
      playBtn.classList.remove('is-playing');
      waveBars.classList.add('d-none');
      timeCurrent.innerText = '00:00';
      updateScrubber(0, totalEstimatedSeconds);

      if (audioMode === 'file' && audioElement) {
        audioElement.pause();
        audioElement.currentTime = 0;
      } else {
        if (synth) synth.cancel();
        stopTimers();
      }
    }

    function startTimers() {
      stopTimers();
      timerInterval = setInterval(() => {
        if (isPlaying && !isDragging) {
          elapsedSeconds++;
          const effectiveTotal = Math.max(elapsedSeconds, Math.round(totalEstimatedSeconds / speeds[speedIdx]));
          timeCurrent.innerText = formatTime(elapsedSeconds);
          timeTotal.innerText = formatTime(effectiveTotal);
          updateScrubber(elapsedSeconds, effectiveTotal);

          if (floatingTime) {
            floatingTime.innerText = `${formatTime(elapsedSeconds)} / ${formatTime(effectiveTotal)}`;
          }
        }
      }, 1000);

      keepAliveInterval = setInterval(() => {
        if (synth && synth.speaking && !synth.paused) {
          synth.pause();
          synth.resume();
        }
      }, 10000);
    }

    function stopTimers() {
      if (timerInterval) clearInterval(timerInterval);
      if (keepAliveInterval) clearInterval(keepAliveInterval);
    }

    function updateScrubber(current, total) {
      if (!total || total <= 0) return;
      const pct = Math.min(100, Math.max(0, (current / total) * 100));
      trackFill.style.width = `${pct}%`;
      trackThumb.style.left = `${pct}%`;
      if (floatingProgressFill) floatingProgressFill.style.width = `${pct}%`;
      track.setAttribute('aria-valuenow', Math.round(pct));
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return '00:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // -------------------------------------------------------------
    // Actions & Listeners
    // -------------------------------------------------------------
    function cycleSpeed() {
      speedIdx = (speedIdx + 1) % speeds.length;
      const spd = speeds[speedIdx];
      const lbl = `${spd.toFixed(1)}x`;
      speedLabel.innerText = lbl;
      if (floatingSpeedToggle) floatingSpeedToggle.innerText = lbl;

      if (audioMode === 'file' && audioElement) {
        audioElement.playbackRate = spd;
      } else if (isPlaying) {
        restartCurrentChunk();
      }
    }

    speedToggle.addEventListener('click', cycleSpeed);
    if (floatingSpeedToggle) floatingSpeedToggle.addEventListener('click', cycleSpeed);

    // Mute
    function toggleMute() {
      isMuted = !isMuted;
      volumeIcon.className = isMuted ? 'fas fa-volume-mute text-danger' : 'fas fa-volume-up';
      if (audioElement) audioElement.muted = isMuted;
      if (synth && isPlaying) restartCurrentChunk();
    }
    if (volumeBtn) volumeBtn.addEventListener('click', toggleMute);

    // Voice Popover
    if (voiceBtn) {
      voiceBtn.addEventListener('click', () => {
        voiceDrawer.classList.toggle('d-none');
      });
    }
    if (drawerCloseBtn) {
      drawerCloseBtn.addEventListener('click', () => {
        voiceDrawer.classList.add('d-none');
      });
    }

    // Skip
    if (skipBack) {
      skipBack.addEventListener('click', () => {
        if (audioMode === 'file' && audioElement) {
          audioElement.currentTime = Math.max(0, audioElement.currentTime - 10);
        } else {
          currentChunkIdx = Math.max(0, currentChunkIdx - 2);
          elapsedSeconds = Math.max(0, elapsedSeconds - 10);
          updateScrubber(elapsedSeconds, totalEstimatedSeconds);
          if (isPlaying) restartCurrentChunk();
        }
      });
    }

    if (skipFwd) {
      skipFwd.addEventListener('click', () => {
        if (audioMode === 'file' && audioElement) {
          audioElement.currentTime = Math.min(audioElement.duration, audioElement.currentTime + 10);
        } else {
          currentChunkIdx = Math.min(textChunks.length - 1, currentChunkIdx + 2);
          elapsedSeconds += 10;
          updateScrubber(elapsedSeconds, totalEstimatedSeconds);
          if (isPlaying) restartCurrentChunk();
        }
      });
    }

    // Scrubber
    function getFraction(e) {
      const rect = track.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    }

    function applySeek(fraction) {
      if (audioMode === 'file' && audioElement && audioElement.duration) {
        audioElement.currentTime = fraction * audioElement.duration;
      } else if (textChunks.length > 0) {
        currentChunkIdx = Math.min(textChunks.length - 1, Math.floor(fraction * textChunks.length));
        elapsedSeconds = Math.round(fraction * totalEstimatedSeconds);
        timeCurrent.innerText = formatTime(elapsedSeconds);
        updateScrubber(elapsedSeconds, totalEstimatedSeconds);
        if (isPlaying) restartCurrentChunk();
      }
    }

    track.addEventListener('pointerdown', (e) => {
      isDragging = true;
      track.setPointerCapture(e.pointerId);
      applySeek(getFraction(e));
    });

    track.addEventListener('pointermove', (e) => {
      const frac = getFraction(e);
      if (isDragging) applySeek(frac);
      if (hoverTooltip) {
        hoverTooltip.classList.remove('d-none');
        hoverTooltip.innerText = formatTime(Math.round(frac * totalEstimatedSeconds));
        hoverTooltip.style.left = `${frac * 100}%`;
      }
    });

    track.addEventListener('pointerup', (e) => {
      if (isDragging) {
        isDragging = false;
        try { track.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    });

    track.addEventListener('pointerleave', () => {
      if (hoverTooltip) hoverTooltip.classList.add('d-none');
    });

    playBtn.addEventListener('click', togglePlayback);
    if (floatingPlayBtn) floatingPlayBtn.addEventListener('click', togglePlayback);

    // Floating Pill Observer
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting && isPlaying) {
          floatingPill.classList.remove('d-none');
        } else {
          floatingPill.classList.add('d-none');
        }
      });
    }, { threshold: 0.1 });

    observer.observe(card);

    if (floatingCloseBtn) {
      floatingCloseBtn.addEventListener('click', () => {
        floatingPill.classList.add('d-none');
      });
    }

    // Keyboard Shortcuts (Space, Left, Right, M)
    window.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;

      if (e.code === 'Space') {
        if (document.activeElement === playBtn || isPlaying) {
          e.preventDefault();
          togglePlayback();
        }
      } else if (e.code === 'KeyM') {
        toggleMute();
      } else if (e.code === 'ArrowLeft' && isPlaying && skipBack) {
        e.preventDefault();
        skipBack.click();
      } else if (e.code === 'ArrowRight' && isPlaying && skipFwd) {
        e.preventDefault();
        skipFwd.click();
      }
    });

    function cleanup() {
      if (synth) synth.cancel();
      if (audioElement) audioElement.pause();
      stopTimers();
    }
    window.addEventListener('beforeunload', cleanup);
    window.addEventListener('pagehide', cleanup);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAudioWidget);
  } else {
    initAudioWidget();
  }
</script>
{% endunless %}
