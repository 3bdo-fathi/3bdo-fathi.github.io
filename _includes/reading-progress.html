<!-- Reading Progress Bar -->
<div id="reading-progress-container" aria-hidden="true">
  <div id="reading-progress-bar"></div>
</div>

<style>
  #reading-progress-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: transparent;
    z-index: 99999;
    pointer-events: none;
  }
  #reading-progress-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #1f6feb, #58a6ff, #79c0ff);
    box-shadow: 0 0 10px rgba(88, 166, 255, 0.7);
    transition: width 0.08s ease-out;
  }
</style>

<script>
  (function () {
    const bar = document.getElementById('reading-progress-bar');
    if (!bar) return;

    let ticking = false;

    function updateProgress() {
      const article = document.querySelector('article') || document.body;
      const rect = article.getBoundingClientRect();
      const articleTop = rect.top + window.scrollY;
      const articleHeight = rect.height;
      const windowHeight = window.innerHeight;
      const scrollY = window.scrollY;

      const totalScrollable = articleHeight - windowHeight;
      if (totalScrollable <= 0) {
        bar.style.width = '100%';
        ticking = false;
        return;
      }

      const progress = Math.max(0, Math.min(100, ((scrollY - articleTop) / totalScrollable) * 100));
      bar.style.width = progress + '%';
      
      /* Save to localStorage for sidebar Continue Reading Tracker */
      try {
        var roundPct = Math.round(progress);
        var headingElem = document.querySelector('h1[data-toc-skip]') || document.querySelector('header h1') || document.querySelector('article h1');
        var articleTitle = headingElem ? headingElem.innerText.trim() : document.title;
        localStorage.setItem('recent_reading_tracker', JSON.stringify({
          title: articleTitle,
          url: window.location.pathname,
          progress: roundPct,
          timestamp: Date.now()
        }));
      } catch (err) {}

      ticking = false;
    }

    window.addEventListener('scroll', function () {
      if (!ticking) {
        window.requestAnimationFrame(updateProgress);
        ticking = true;
      }
    }, { passive: true });

    window.addEventListener('resize', updateProgress);
    document.addEventListener('DOMContentLoaded', updateProgress);
  })();
</script>
