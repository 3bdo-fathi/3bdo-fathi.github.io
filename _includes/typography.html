<!-- Google Fonts: Manrope (Modern Editorial Latin), Tajawal (Modern Editorial Arabic), Source Code Pro (Clean Monospace) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Source+Code+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

<style>
  /* ==========================================================================
     Modern Editorial / Research Typography System (Manrope + Tajawal + Source Code Pro)
     Designed for prolonged reading comfort, deep technical guides, and multi-weight clarity
     ========================================================================== */
  :root {
    --font-family-sans-serif: 'Manrope', 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-family-monospace: 'Source Code Pro', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --font-family-heading: 'Manrope', 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  /* Global Body Base */
  html, body {
    font-family: 'Manrope', 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
    -webkit-font-smoothing: antialiased !important;
    -moz-osx-font-smoothing: grayscale !important;
    text-rendering: optimizeLegibility !important;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  }

  /* Headings: Editorial presence with balanced optical weights */
  h1, h2, h3, h4, h5, h6,
  .site-title,
  .post-title,
  .dynamic-title,
  .card-title,
  .modal-title {
    font-family: 'Manrope', 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
    letter-spacing: -0.024em !important;
  }

  h1, .post-title {
    font-weight: 800 !important;
    line-height: 1.25 !important;
  }
  h2 {
    font-weight: 750 !important;
    letter-spacing: -0.02em !important;
    line-height: 1.35 !important;
  }
  h3 {
    font-weight: 700 !important;
    letter-spacing: -0.015em !important;
    line-height: 1.4 !important;
  }
  h4 {
    font-weight: 650 !important;
  }
  h5, h6 {
    font-weight: 600 !important;
  }

  /* Body & Paragraphs: Comfortable reading cadence */
  p, li, article, .content, .post-content {
    font-family: 'Manrope', 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    line-height: 1.8 !important;
    letter-spacing: -0.008em !important;
    font-weight: 400;
  }

  /* Strong & Bold hierarchy */
  strong, b, .fw-bold, b strong, strong b {
    font-weight: 750 !important;
    color: inherit;
  }
  .fw-semibold {
    font-weight: 600 !important;
  }
  .fw-medium {
    font-weight: 500 !important;
  }
  .fw-normal {
    font-weight: 400 !important;
  }
  .fw-light {
    font-weight: 300 !important;
  }

  /* Italics & Emphasized elements */
  em, i, .fst-italic, cite, dfn {
    font-style: italic !important;
  }

  /* Editorial Blockquotes */
  blockquote {
    font-style: italic !important;
    border-left: 4px solid var(--sidebar-active-color, #38bdf8) !important;
    padding: 0.75rem 1.25rem !important;
    margin: 1.5rem 0 !important;
    background: rgba(56, 189, 248, 0.04) !important;
    border-radius: 0 8px 8px 0 !important;
  }
  blockquote p {
    font-style: italic !important;
    line-height: 1.75 !important;
  }
  blockquote cite {
    display: block !important;
    font-style: normal !important;
    font-weight: 600 !important;
    font-size: 0.88rem !important;
    margin-top: 0.5rem !important;
    opacity: 0.85 !important;
  }

  /* Text Decorations & Accents */
  mark {
    background-color: rgba(245, 158, 11, 0.22) !important;
    color: inherit !important;
    padding: 0.12em 0.35em !important;
    border-radius: 4px !important;
  }
  del, s, strike {
    text-decoration: line-through !important;
    opacity: 0.72 !important;
  }
  ins, u {
    text-decoration: underline !important;
    text-underline-offset: 3px !important;
    text-decoration-thickness: 1.5px !important;
  }

  /* Monospace & Technical Code Blocks */
  code, pre, kbd, samp,
  .highlight, pre.highlight,
  .filepath, .code-header,
  .code-header span {
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-variant-ligatures: normal !important;
  }

  /* Inline Code Pills */
  p > code, li > code, td > code, th > code {
    font-size: 0.88em !important;
    padding: 0.15em 0.42em !important;
    border-radius: 5px !important;
    font-weight: 550 !important;
  }

  /* Syntax Highlighting Italic Comments */
  .highlight .c,
  .highlight .ch,
  .highlight .cm,
  .highlight .c1,
  .highlight .cs,
  .highlight .cp {
    font-style: italic !important;
    opacity: 0.82;
  }

  #sidebar {
    font-family: 'Manrope', 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif !important;
  }
  #sidebar .nav-link span {
    font-family: 'Manrope', 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif !important;
    letter-spacing: 0.01em !important;
    font-weight: 500 !important;
  }
  #sidebar .site-title a {
    font-family: 'Manrope', 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif !important;
    letter-spacing: -0.025em !important;
    font-weight: 800 !important;
  }
  .site-subtitle-wrapper {
    font-family: 'Manrope', 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif !important;
    letter-spacing: -0.01em !important;
    font-weight: 450 !important;
  }

  /* Arabic Specific Optimization (Tajawal) */
  :lang(ar), [dir="rtl"], .arabic-text {
    font-family: 'Tajawal', 'Manrope', -apple-system, sans-serif !important;
    line-height: 1.88 !important;
    letter-spacing: 0 !important;
  }
  :lang(ar) h1, :lang(ar) h2, :lang(ar) h3,
  [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3 {
    font-family: 'Tajawal', -apple-system, sans-serif !important;
    font-weight: 800 !important;
  }
  :lang(ar) strong, :lang(ar) b,
  [dir="rtl"] strong, [dir="rtl"] b {
    font-weight: 800 !important;
  }
</style>
