<!-- Google Fonts: Inter (Global Tech UI), Cairo (Modern Arabic), JetBrains Mono (Developer Code) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ==========================================================================
     Global Typography Masterclass (Inter + Cairo + JetBrains Mono)
     ========================================================================== */
  :root {
    --font-family-sans-serif: 'Inter', 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-family-monospace: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --font-family-heading: 'Inter', 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  html, body {
    font-family: 'Inter', 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
    -webkit-font-smoothing: antialiased !important;
    -moz-osx-font-smoothing: grayscale !important;
    text-rendering: optimizeLegibility !important;
  }

  /* Headings: Clean, modern, tight letter-spacing */
  h1, h2, h3, h4, h5, h6,
  .site-title,
  .post-title,
  .dynamic-title,
  .card-title,
  .modal-title {
    font-family: 'Inter', 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
    letter-spacing: -0.022em !important;
  }

  h1, .post-title { font-weight: 800 !important; }
  h2 { font-weight: 750 !important; }
  h3 { font-weight: 700 !important; }

  /* Body Text: Enhanced Line-height & Crispness */
  p, li, article, .content, .post-content {
    font-family: 'Inter', 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    line-height: 1.72 !important;
    letter-spacing: -0.011em !important;
  }

  /* Code & Technical Blocks */
  code, pre, kbd, samp,
  .highlight, pre.highlight,
  .filepath, .code-header,
  .code-header span {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-variant-ligatures: normal !important;
  }

  /* Inline code pill */
  p > code, li > code, td > code, th > code {
    font-size: 0.87em !important;
    padding: 0.16em 0.4em !important;
    border-radius: 5px !important;
    font-weight: 500 !important;
  }

  /* Sidebar Navigation & Typography */
  #sidebar {
    font-family: 'Inter', 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif !important;
  }
  #sidebar .nav-link span {
    font-family: 'Inter', 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif !important;
    letter-spacing: 0.015em !important;
  }
  #sidebar .site-title a {
    font-family: 'Inter', 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif !important;
    letter-spacing: -0.02em !important;
    font-weight: 750 !important;
  }
  .site-subtitle-wrapper {
    font-family: 'Inter', 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif !important;
    letter-spacing: -0.01em !important;
  }

  /* Arabic text optimization (auto-detected via language / direction) */
  :lang(ar), [dir="rtl"], .arabic-text {
    font-family: 'Cairo', 'Inter', -apple-system, sans-serif !important;
    line-height: 1.8 !important;
    letter-spacing: 0 !important;
  }
</style>
