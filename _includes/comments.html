<!-- Comments via Giscus (GitHub Discussions) -->
{% if site.comments.provider == 'giscus' and site.comments.giscus.repo %}
  <div id="giscus-wrapper" class="mt-5 pt-3" style="border-top: 1px solid rgba(88, 166, 255, 0.15);">
    <div class="d-flex align-items-center gap-2 mb-3" style="color: #58a6ff; font-weight: 600; font-size: 1.05rem;">
      <i class="far fa-comments"></i>
      <span>Discussion & Comments</span>
    </div>
    <div id="giscus_thread"></div>
    <script
      src="https://giscus.app/client.js"
      data-repo="{{ site.comments.giscus.repo }}"
      data-repo-id="{{ site.comments.giscus.repo_id }}"
      data-category="{{ site.comments.giscus.category | default: 'General' }}"
      data-category-id="{{ site.comments.giscus.category_id }}"
      data-mapping="{{ site.comments.giscus.mapping | default: 'pathname' }}"
      data-strict="{{ site.comments.giscus.strict | default: '0' }}"
      data-reactions-enabled="{{ site.comments.giscus.reactions_enabled | default: '1' }}"
      data-emit-metadata="0"
      data-input-position="{{ site.comments.giscus.input_position | default: 'bottom' }}"
      data-theme="preferred_color_scheme"
      data-lang="{{ site.comments.giscus.lang | default: 'en' }}"
      data-loading="lazy"
      crossorigin="anonymous"
      async
    ></script>
  </div>
{% endif %}
