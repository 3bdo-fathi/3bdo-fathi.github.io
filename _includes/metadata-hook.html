<!-- Global Author & Technical SEO Meta Tags -->
<meta name="author" content="{{ site.social.name | default: 'Abdulrahman M. Fathi' }}">
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
<meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
<meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">

<!-- Canonical URL -->
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Open Graph & Twitter Site Meta -->
<meta property="og:site_name" content="{{ site.title | default: 'Abdulrahman M. Fathi' }}">
<meta property="og:locale" content="en_US">
<meta name="twitter:site" content="@{{ site.twitter.username | default: '3bdofathii' }}">
<meta name="twitter:creator" content="@{{ site.twitter.username | default: '3bdofathii' }}">

<!-- Dynamic Meta Keywords -->
{% if page.tags.size > 0 %}
  <meta name="keywords" content="{{ page.tags | join: ', ' }}, {{ page.categories | join: ', ' }}, cybersecurity, penetration testing, red team, security research">
{% elsif site.keywords %}
  <meta name="keywords" content="{{ site.keywords | strip }}">
{% endif %}

<!-- Google Structured Data (JSON-LD) for TechArticle & BreadcrumbList -->
{% if page.layout == 'post' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.excerpt | strip_html | strip_newlines | jsonify }},
  "inLanguage": "en-US",
  "proficiencyLevel": "Expert",
  "keywords": {{ page.tags | join: ', ' | jsonify }},
  "articleSection": {{ page.categories | join: ' > ' | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  },
  "author": {
    "@type": "Person",
    "name": "{{ site.social.name | default: 'Abdulrahman M. Fathi' }}",
    "jobTitle": "Cyber Security Engineer & Penetration Tester",
    "url": "https://www.linkedin.com/in/3bdo-fathi"
  },
  "publisher": {
    "@type": "Person",
    "name": "{{ site.title | default: 'Abdulrahman M. Fathi' }}",
    "url": "{{ site.url }}"
  }{% if page.image %},
  "image": {
    "@type": "ImageObject",
    "url": "{{ page.image.path | default: page.image | absolute_url }}"
  }{% endif %}
}
</script>

<!-- Breadcrumbs Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}/"
    }{% if page.categories.size > 0 %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.categories[0] | jsonify }},
      "item": "{{ site.url }}/categories/{{ page.categories[0] | slugify }}/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }
    {% else %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.title | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }
    {% endif %}
  ]
}
</script>
{% elsif page.layout == 'home' or page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ site.title | default: 'Abdulrahman M. Fathi' }}",
  "url": "{{ site.url }}",
  "description": {{ site.description | jsonify }},
  "author": {
    "@type": "Person",
    "name": "Abdulrahman M. Fathi",
    "alternateName": ["0x3bdo", "Abdulrahman Mohamed"],
    "jobTitle": "Cyber Security Engineer & Penetration Tester",
    "url": "{{ site.url }}",
    "sameAs": [
      "https://github.com/3bdo-fathi",
      "https://www.linkedin.com/in/3bdo-fathi",
      "https://twitter.com/3bdofathii"
    ],
    "knowsAbout": [
      "Cybersecurity",
      "Penetration Testing",
      "Reverse Engineering",
      "Android Security",
      "Active Directory Security",
      "Threat Research",
      "Vulnerability Assessment"
    ]
  },
  "potentialAction": {
    "@type": "SearchAction",
    "target": {
      "@type": "EntryPoint",
      "urlTemplate": "{{ site.url }}/?q={search_term_string}"
    },
    "query-input": "required name=search_term_string"
  }
}
</script>
{% endif %}

<!-- Global High-End Typography & Font System (Inter + Cairo + JetBrains Mono) -->
{% include typography.html %}
