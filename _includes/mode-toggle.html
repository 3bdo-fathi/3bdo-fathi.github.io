<!-- Premium OLED Pitch Black & Crisp Editorial Light Mode Theme System -->
<style>

  /* ========================================================

  /* Card base */
  .card-wrapper.card {

  /* Glassmorphic Topbar */
  #topbar-wrapper {
    backdrop-filter: blur(14px) !important;
    -webkit-backdrop-filter: blur(14px) !important;
  }

  .post-preview img {
    border-radius: 8px !important;

  /* Universal Dedication Tribute Bar (Posts & About Tab) */
  .post-dedication-bar {
    border-radius: 10px !important;

  /* Light mode dedication - Deep Charcoal, 100% Crisp Contrast */

<script type="text/javascript">
  /* Unregister any stale legacy service worker to ensure instant fresh updates */
  if ('serviceWorker' in navigator) {
    try {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      });
    } catch (e) {}
  }

  /* Instant mode application before DOM render to prevent theme flicker */
  (function() {
    try {
      var saved = localStorage.getItem('mode') || localStorage.getItem('theme') || sessionStorage.getItem('mode');
      var m = (saved === 'light') ? 'light' : 'dark';
      document.documentElement.setAttribute('data-mode', m);
      document.documentElement.setAttribute('data-bs-theme', m);
    } catch (e) {}
  })();

  window.ModeManager = {
    get current() {
      var attr = document.documentElement.getAttribute('data-bs-theme') || document.documentElement.getAttribute('data-mode');
      if (attr === 'light' || attr === 'dark') return attr;
      var saved = localStorage.getItem('mode') || localStorage.getItem('theme');
      return (saved === 'light') ? 'light' : 'dark';
    },

    setMode: function(mode, persist) {
      if (typeof persist === 'undefined') persist = true;
      var m = (mode === 'light') ? 'light' : 'dark';
      document.documentElement.setAttribute('data-mode', m);
      document.documentElement.setAttribute('data-bs-theme', m);
      if (persist) {
        try {
          localStorage.setItem('mode', m);
          localStorage.setItem('theme', m);
          sessionStorage.setItem('mode', m);
        } catch (e) {}
      }
      try {
        window.postMessage({ id: 'theme-updated', message: m }, '*');
        window.dispatchEvent(new CustomEvent('theme-change', { detail: { theme: m } }));
      } catch (e) {}
    },

    toggle: function() {
      var next = (this.current === 'dark') ? 'light' : 'dark';
      this.setMode(next, true);
    }
  };

  /* Maintain 100% sync between data-mode and data-bs-theme */
  try {
    var _themeObserver = new MutationObserver(function(mutations) {
      mutations.forEach(function(mut) {
        if (mut.attributeName === 'data-bs-theme' || mut.attributeName === 'data-mode') {
          var val = document.documentElement.getAttribute(mut.attributeName);
          if (val === 'light' || val === 'dark') {
            var other = (mut.attributeName === 'data-bs-theme') ? 'data-mode' : 'data-bs-theme';
            if (document.documentElement.getAttribute(other) !== val) {
              document.documentElement.setAttribute(other, val);
            }
          }
        }
      });
    });
    _themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-mode', 'data-bs-theme'] });
  } catch (err) {}

  function updateModeIcons(mode) {
    var isDark = mode === 'dark';
    var iconClass = isDark ? 'fas fa-sun' : 'fas fa-moon';
    var titleText = isDark ? 'Switch to light mode' : 'Switch to dark mode';

    var sidebarBtn = document.getElementById('mode-toggle');
    if (sidebarBtn) {
      sidebarBtn.setAttribute('title', titleText);
      sidebarBtn.setAttribute('aria-label', titleText);
      var iconSidebar = sidebarBtn.querySelector('i');
      if (iconSidebar) {
        iconSidebar.className = iconClass;
      }
    }
  }

  /* Bind mode-toggle click and keyboard shortcuts */
  function bindModeToggle() {
    function wireButton(btn) {
      if (btn && !btn.dataset.modeBound) {
        btn.dataset.modeBound = 'true';
        btn.style.cursor = 'pointer';
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          window.ModeManager.toggle();
        });
      }
    }

    wireButton(document.getElementById('mode-toggle'));

    updateModeIcons(window.ModeManager.current);

    window.addEventListener('theme-change', function(e) {
      if (e.detail && e.detail.theme) {
        updateModeIcons(e.detail.theme);
      }
    });

    if (!window._searchShortcutBound) {
      window._searchShortcutBound = true;
      document.addEventListener('keydown', function(e) {
        var activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        var isInput = activeTag === 'input' || activeTag === 'textarea' || (document.activeElement && document.activeElement.isContentEditable);

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          triggerSearch();
        } else if (e.key === '/' && !isInput) {
          e.preventDefault();
          triggerSearch();
        } else if (e.key === 'Escape') {
          var searchInput = document.getElementById('search-input');
          var searchCancel = document.getElementById('search-cancel');
          if (searchInput && document.activeElement === searchInput) {
            if (searchCancel) {
              searchCancel.click();
            } else {
              searchInput.blur();
            }
          }
        }
      });
    }

    function triggerSearch() {
      var searchTrigger = document.getElementById('search-trigger');
      var searchInput = document.getElementById('search-input');
      if (searchTrigger && window.getComputedStyle(searchTrigger).display !== 'none') {
        searchTrigger.click();
      }
      if (searchInput) {
        searchInput.focus();
        searchInput.select();
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindModeToggle);
  } else {
    bindModeToggle();
  }
</script>
